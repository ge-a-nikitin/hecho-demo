# The only origin entry point: Cloudflare Tunnel -> this nginx.
# /api/* goes to the api container, everything else is the static SPA.

# cloudflared sends X-Forwarded-Proto: https; direct access (local debugging,
# plain HTTP) has no header, so fall back to the scheme of the current connection.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# cloudflared is the only hop that may declare the client address: it reaches
# this container through the loopback-published port, and Cloudflare writes the
# real address into CF-Connecting-IP at the edge. Docker re-originates such a
# connection from the bridge gateway, so the container sees a private peer -
# trusting only 127.0.0.1 would leave every client on the gateway address, and
# trusting everything would let a caller spoof the header. The private ranges
# are unreachable from outside: only the host and this compose network can
# connect here.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA, the API and every download are served from this origin, so the
    # browser must not second-guess a declared type: with nosniff a downloaded
    # file stays a download even if its bytes look like a page. `always` keeps the
    # header on error responses. The locations below that set their own
    # `add_header` repeat it, because nginx drops the inherited ones there.
    add_header X-Content-Type-Options "nosniff" always;

    # API, Better Auth (/api/auth/*), Swagger UI and OpenAPI JSON (/api/docs*).
    # proxy_pass without a URI keeps the original path, so /api/... reaches the API intact.
    location /api/ {
        proxy_pass http://api:6201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr is the address resolved above, not the peer: send it twice
        # and never append. Better Auth treats a multi-value X-Forwarded-For as
        # "no address", so appending would let any caller erase the client IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        # Cloudflare drops a request after 100 seconds, so waiting longer is pointless.
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
        # The API limits uploads to 1 MB; keep 413 coming from the API, not from nginx.
        client_max_body_size 2m;
    }

    # Vite emits content-hashed asset names, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html points at the current asset hashes, so it must be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

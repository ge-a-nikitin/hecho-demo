  - "@better-auth/mongo-adapter@1.7.17"
  - "@better-auth/prisma-adapter@1.7.17"
  - "@better-auth/telemetry@1.7.17"
  - "@nestjs/common@12.3.3"
  - "@nestjs/core@12.3.3"
  - "@nestjs/platform-express@12.3.3"
  - better-auth@1.7.17
  - better-call@1.4.5
  - "@nestjs/testing@12.3.3"
